[package]
name = "gtfs-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Dmitrii Lopanov <sexykdi@gmail.com>"]
description = "Complete in-memory data model of the GTFS Schedule specification: every file and field of the reference, dependency-free"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/LdDl/gtfs-rs"
keywords = ["gtfs", "transit", "public-transport", "schedule", "timetable"]
categories = ["data-structures", "science::geo"]

[features]
# CSV parsing of GTFS tables (gtfs_rs::parsers::csv); adds the `csv`
# dependency
parse = ["dep:csv"]
# locations.geojson parsing (gtfs_rs::parsers::geojson); implies
# `parse` and adds the `serde_json` dependency
geojson = ["parse", "dep:serde_json"]

[dependencies]
csv = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "read_feed"
required-features = ["parse"]
